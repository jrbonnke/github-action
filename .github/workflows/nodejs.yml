# .github/workflows/nodejs.yml
name: Node.js CI

on:
  push:
    branches: [ action-v1 ]
  pull_request:
    branches: [ action-v1 ]

jobs:
  build:
    runs-on: ec2-host
    #runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm test
